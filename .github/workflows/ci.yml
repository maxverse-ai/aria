name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node 20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify release policy
        run: pnpm release:check
        env:
          ARIA_RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  package:
    name: Candidate package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check toolchain
        run: pnpm infra:doctor

      - name: Build candidate artifact
        run: pnpm artifact:build

      - name: Verify candidate artifact
        run: pnpm artifact:verify

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
